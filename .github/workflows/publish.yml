name: publish

on:
  push:
    # Bare SemVer tags, no "v" prefix — 1.2.0, 0.3.0-beta, etc.
    # See CONFIGTRANSFORM_TOOL_DESIGN.md §4 and CONFIG_MANAGEMENT.md §10.8.
    tags:
      - "[0-9]+.[0-9]+.[0-9]+*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create the GitHub Release
      packages: write # to push to GitHub Packages (also grants the read needed to install it back)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - run: dotnet restore

      - run: dotnet build --no-restore --configuration Release

      - run: dotnet test --no-build --configuration Release

      - name: Pack
        # ${{ github.ref_name }} is the bare tag value (e.g. "1.2.0") — used directly as the
        # package version with no prefix-stripping needed.
        run: dotnet pack --no-build --configuration Release -p:Version=${{ github.ref_name }} --output ./nupkg

      - name: Push to GitHub Packages
        run: >
          dotnet nuget push "./nupkg/*.nupkg"
          --source "https://nuget.pkg.github.com/taljacob2/index.json"
          --api-key ${{ secrets.GITHUB_TOKEN }}
          --skip-duplicate

      - name: Verify the published packages are actually installable and runnable
        # Not redundant with `dotnet build`/`dotnet test`: packaging bugs (a missing
        # PackAsTool, a wrong ToolCommandName, a dependency left out of the .nupkg) are
        # invisible to those and only show up when a real consumer installs the package.
        run: bash scripts/smoke-test-published-tool.sh "${{ github.ref_name }}" "taljacob2" "${{ secrets.GITHUB_TOKEN }}"

      - name: Create GitHub Release with notes from CHANGELOG.md
        # Release notes are sourced from docs/CHANGELOG.md's matching version section, not
        # written a second time — see docs/RELEASING.md.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PRERELEASE_FLAG=""
          if [[ "${{ github.ref_name }}" == *-* ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes-file <(bash scripts/extract-changelog-section.sh "${{ github.ref_name }}") \
            $PRERELEASE_FLAG
